<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tema Değiştirmeli Site</title>
  <!-- Bootstrap 5 CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #212529;
      --header-bg: #343a40;
      --footer-bg: #343a40;
      --card-bg: #f8f9fa;
    }
    
    [data-theme="dark"] {
      --bg-color: #212529;
      --text-color: #f8f9fa;
      --header-bg: #1a1a1a;
      --footer-bg: #121212;
      --card-bg: #2c3034;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    header {
      background-color: var(--header-bg) !important;
      transition: background-color 0.3s ease;
    }
    
    footer {
      background-color: var(--footer-bg) !important;
      transform: translateY(100%);
      transition: all 0.4s ease;
    }
    
    body.scrolled footer {
      transform: translateY(0);
    }
    
    .card {
      background-color: var(--card-bg);
      transition: background-color 0.3s ease;
    }
    
    .form-check-input:checked {
      background-color: #6c757d;
      border-color: #6c757d;
    }
    
    /* Responsive ayarlar */
    @media (max-width: 768px) {
      .header-title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header with Theme Toggle -->
  <header class="fixed-top py-3 shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="header-title mb-0 fs-4 text-white">Site Başlığı</h1>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="themeSwitch">
        <label class="form-check-label text-white" for="themeSwitch">
          <i class="bi bi-sun-fill d-none" id="sunIcon"></i>
          <i class="bi bi-moon-stars-fill" id="moonIcon"></i>
        </label>
      </div>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="flex-grow-1 py-5 mt-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow mb-4">
            <div class="card-body text-center">
              <h2 class="card-title">Tema Değiştirme Örneği</h2>
              <p class="card-text">Header'daki switch ile koyu/açık tema arasında geçiş yapabilirsiniz.</p>
              <div class="content-placeholder" style="height: 1200px;"></div>
              <p class="text-muted">Sayfayı aşağı kaydırın (footer sadece en altta görünecek)</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-white py-3">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
          <p class="mb-md-0">© 2023 Tüm Hakları Saklıdır</p>
        </div>
        <div class="col-md-6 text-center text-md-end mt-2 mt-md-0">
          <a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-white me-3"><i class="bi bi-twitter"></i></a>
          <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Özel Scriptler -->
  <script>
    // Tema Değiştirme
    const themeSwitch = document.getElementById('themeSwitch');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    
    // LocalStorage'dan tema kontrolü
    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      themeSwitch.checked = true;
      toggleIcons();
    }
    
    // Switch event listener
    themeSwitch.addEventListener('change', function() {
      if (this.checked) {
        document.body.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      }
      toggleIcons();
    });
    
    function toggleIcons() {
      sunIcon.classList.toggle('d-none');
      moonIcon.classList.toggle('d-none');
    }
    
    // Footer Kontrolü
    window.addEventListener('scroll', function() {
      const isBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50;
      document.body.classList.toggle('scrolled', isBottom);
    });
  </script>
</body>
</html>
