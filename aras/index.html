<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Header-Footer Örneği</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Özel Stiller */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    main {
      flex: 1;
      padding-top: 56px; /* Header yüksekliği kadar boşluk */
    }
    
    footer {
      transition: all 0.3s ease;
    }
    
    /* Varsayılan durumda footer gizli */
    body:not(.scrolled) footer {
      transform: translateY(100%);
    }
  </style>
</head>
<body>
  <!-- Sabit Header -->
  <header class="bg-dark text-white fixed-top py-3">
    <div class="container">
      <h1 class="mb-0">Site Başlığı</h1>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="container py-4">
    <div class="row">
      <div class="col">
        <h2>Hoş Geldiniz</h2>
        <p class="lead">Bu sayfada footer sadece en alta kaydırıldığında görünür.</p>
        
        <!-- Uzun içerik örneği -->
        <div style="height: 1500px;" class="d-flex align-items-center justify-content-center">
          <div class="text-center">
            <p class="fs-4">Sayfayı aşağı kaydırın</p>
            <i class="bi bi-arrow-down fs-1"></i>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Gizli Footer -->
  <footer class="bg-dark text-white py-3">
    <div class="container">
      <p class="mb-0">© 2023 Tüm Hakları Saklıdır</p>
    </div>
  </footer>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Scroll Kontrolü -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      window.addEventListener('scroll', function() {
        // Sayfanın en altında olup olmadığını kontrol et
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight) {
          document.body.classList.add('scrolled');
        } else {
          document.body.classList.remove('scrolled');
        }
      });
    });
  </script>
</body>
</html>
