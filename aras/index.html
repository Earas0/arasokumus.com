<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Theme Switcher</title>
  <!-- Bootstrap 5 CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #212529;
      --header-bg: #343a40;
      --footer-bg: #343a40;
      --card-bg: #f8f9fa;
    }
    
    [data-theme="dark"] {
      --bg-color: #212529;
      --text-color: #f8f9fa;
      --header-bg: #1a1a1a;
      --footer-bg: #121212;
      --card-bg: #2c3034;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    header {
      background-color: var(--header-bg);
      transition: background-color 0.3s ease;
    }
    
    /* Advanced Theme Switch */
    .theme-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }
    
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #6c757d;
      transition: .4s;
      border-radius: 34px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #495057;
    }
    
    input:checked + .slider:before {
      transform: translateX(30px);
    }
    
    /* Fixed icons */
    .theme-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: white;
      transition: opacity 0.3s;
    }
    
    .sun-icon {
      left: 8px;
      opacity: 0;
    }
    
    .moon-icon {
      right: 8px;
      opacity: 1;
    }
    
    [data-theme="dark"] .sun-icon {
      opacity: 1;
    }
    
    [data-theme="dark"] .moon-icon {
      opacity: 0;
    }
    
    /* Diğer stiller... */
  </style>
</head>
<body>
  <!-- Header with Advanced Theme Toggle -->
  <header class="fixed-top py-3 shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="header-title mb-0 fs-4 text-white">Site Başlığı</h1>
      <label class="theme-switch">
        <input type="checkbox" id="themeSwitch">
        <span class="slider"></span>
        <i class="bi bi-sun-fill theme-icon sun-icon"></i>
        <i class="bi bi-moon-stars-fill theme-icon moon-icon"></i>
      </label>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="flex-grow-1 py-5 mt-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow mb-4">
            <div class="card-body text-center">
              <h2 class="card-title">Gelişmiş Tema Değiştirici</h2>
              <p class="card-text">Switch butonundaki ikonlar sabit konumda kalır</p>
              <div style="height: 1200px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-white py-3">
    <div class="container text-center">
      <p class="mb-0">© 2023 Tüm Hakları Saklıdır</p>
    </div>
  </footer>

  <!-- Scriptler -->
  <script>
    // Tema Değiştirme
    const themeSwitch = document.getElementById('themeSwitch');
    
    // LocalStorage kontrolü
    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      themeSwitch.checked = true;
    }
    
    // Switch event listener
    themeSwitch.addEventListener('change', function() {
      if (this.checked) {
        document.body.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
