<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Header-Footer</title>
  <!-- Bootstrap 5 CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    /* Temel Yapı */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: 56px; /* Header yüksekliği için */
      background-color: #00061a
    }
    
    /* Header */
    header {
      transition: all 0.3s ease;
      background-color: #1a1a1a
    }
    
    /* Mobil Header */
    @media (max-width: 768px) {
      header {
        padding: 0.5rem !important;
      }
      .header-title {
        font-size: 1.25rem !important;
      }
    }
    
    /* Footer Stilleri */
    footer {
      transform: translateY(100%);
      transition: all 0.4s ease;
    }
    
    body.scrolled footer {
      transform: translateY(0);
    }
    
    /* Tablet ve Mobil Footer */
    @media (max-width: 992px) {
      footer {
        padding: 1rem !important;
      }
      footer p {
        font-size: 0.9rem;
      }
    }
    
    /* İçerik Alanı */
    .content-placeholder {
      height: 200vh; /* Test için yüksek içerik */
    }
    
    /* Scroll İpucu */
    .scroll-hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99;
      display: none;
    }
    
    @media (max-width: 576px) {
      .scroll-hint {
        display: block;
      }
    }
  </style>
</head>
<body>
  <!-- Responsive Header -->
  <header class="text-white fixed-top py-3 shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="header-title mb-0 fs-4">EARAS</h1>
      <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse">
        <i class="bi bi-list text-white"></i>
      </button>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="flex-grow-1 py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h2 class="text-center mb-4">Responsive Tasarım</h2>
          <div class="content-placeholder bg-light rounded p-4 d-flex align-items-center justify-content-center">
            <div class="text-center">
              <p class="fs-5"></p>
              <i class="bi bi-arrow-down fs-1 text-primary"></i>
              <p class="mt-3 d-none d-md-block">Footer sadece en altta görünecek</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Responsive Footer -->
  <footer class="bg-dark text-white py-3">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
          <p class="mb-md-0">© 2025 Tüm Hakları Saklıdır</p>
        </div>
        <div class="col-md-6 text-center text-md-end mt-2 mt-md-0">
          <a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-white me-3"><i class="bi bi-twitter"></i></a>
          <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Mobil Scroll İpucu -->
  <div class="scroll-hint">
    <button class="btn btn-primary rounded-circle p-3">
      <i class="bi bi-arrow-down"></i>
    </button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Dinamik Footer Kontrolü -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const footerTrigger = 100; // Piksel toleransı
      
      window.addEventListener('scroll', function() {
        const isBottom = (window.innerHeight + window.scrollY) >= 
                         (document.body.offsetHeight - footerTrigger);
        
        document.body.classList.toggle('scrolled', isBottom);
      });
      
      // Mobil scroll butonu
      document.querySelector('.scroll-hint button').addEventListener('click', function() {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: 'smooth'
        });
      });
    });
  </script>
</body>
</html>
